version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: archeodb
      POSTGRES_USER: archeo_user
      POSTGRES_PASSWORD: archeo_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: .
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    environment:
      - POSTGRES_DB=archeodb
      - POSTGRES_USER=archeo_user
      - POSTGRES_PASSWORD=archeo_password
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume: